name: dist

on:
  # 手动触发
  workflow_dispatch:
  # 打 v* tag 自动构建三平台安装包
  push:
    tags:
      - "v*"

jobs:
  dist:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            label: windows
          - os: macos-latest
            script: dist:mac
            label: macos-arm64
          - os: ubuntu-latest
            script: dist:linux
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 后端 PyInstaller 打包需要对应平台的 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # postinstall 会创建 backend/.venv 并 pip install -e .
      - run: pnpm install --frozen-lockfile

      - run: pnpm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: jmcomic-${{ matrix.label }}
          path: dist/installers/**
          if-no-files-found: error
