name: dist

on:
  # 手动触发
  workflow_dispatch:
  # push 到 main 自动打包
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  dist:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_target: win
            label: windows
          - os: macos-latest
            eb_target: mac
            label: macos-arm64
          - os: ubuntu-latest
            eb_target: linux
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 后端 PyInstaller 打包需要对应平台的 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # postinstall 会创建 backend/.venv 并 pip install -e .
      - run: pnpm install --frozen-lockfile

      # 后端单独打包 + CI 冒烟：直接运行冻结尾并探活 /api/health，
      # 把"后端在目标平台起不来"的问题在构建期暴露，输出直接进 workflow 日志
      - run: node scripts/build-backend.mjs
      - run: node scripts/smoke-backend.mjs

      - run: pnpm run build

      - run: pnpm exec electron-builder --${{ matrix.eb_target }} --publish never

      # 校验安装包产物里真的带上了 backend_dist（extraResources）
      - name: Verify backend bundled
        shell: bash
        run: |
          found=$(find dist/installers -type d -name backend_dist | head -1)
          if [ -z "$found" ]; then
            echo "::error::backend_dist not found in packaged output"
            exit 1
          fi
          echo "backend_dist at: $found"
          ls "$found/jmcomic_backend" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: jmcomic-${{ matrix.label }}
          path: dist/installers/**
          if-no-files-found: error
