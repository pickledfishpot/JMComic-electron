name: dist

on:
  # 手动触发（不发 Release，仅出 artifacts）
  workflow_dispatch:
  # 打 tag（v*）自动打包并发 Release
  push:
    tags:
      - "v*"

jobs:
  dist:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            eb_target: win
            label: windows
          # - os: macos-latest
          #   eb_target: mac
          #   label: macos-arm64
          # - os: ubuntu-latest
          #   eb_target: linux
          #   label: linux
    runs-on: ${{ matrix.os }}
    permissions:
      # 打 tag 时创建 Release 并上传产物需要写权限
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 后端 PyInstaller 打包需要对应平台的 Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # postinstall 会创建 backend/.venv 并 pip install -e .
      - run: pnpm install --frozen-lockfile

      # 后端单独打包 + CI 冒烟：直接运行冻结尾并探活 /api/health，
      # 把"后端在目标平台起不来"的问题在构建期暴露，输出直接进 workflow 日志
      - run: node scripts/build-backend.mjs
      - run: node scripts/smoke-backend.mjs

      - run: pnpm run build

      - run: pnpm exec electron-builder --${{ matrix.eb_target }} --publish never

      # 校验安装包产物里真的带上了 backend_dist（extraResources）
      - name: Verify backend bundled
        shell: bash
        run: |
          found=$(find dist/installers -type d -name backend_dist | head -1)
          if [ -z "$found" ]; then
            echo "::error::backend_dist not found in packaged output"
            exit 1
          fi
          echo "backend_dist at: $found"
          ls "$found/jmcomic_backend" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: jmcomic-${{ matrix.label }}
          path: dist/installers/**
          if-no-files-found: error

      # 打 tag（v*）时把安装包发布到 GitHub Release（草稿，人工核对后发布）。
      # 只传安装包本体，不能 dist/installers/**——那会把 win-unpacked/ 整目录
      # （几百个 dll/exe/pyd）全部当资产传上去
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/installers/*.zip
            dist/installers/*.dmg
            dist/installers/*.exe
            dist/installers/*.AppImage
            dist/installers/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
