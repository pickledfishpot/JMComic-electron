appId: cc.jpacg.jmcomic-electron
productName: JMComic
copyright: Copyright © 2026
directories:
  output: dist/installers
  buildResources: resources
files:
  - dist/electron/**/*
  - dist/renderer/**/*
  - package.json
extraResources:
  - from: backend_dist
    to: backend_dist
    filter:
      - "**/*"
  - from: resources/icons
    to: icons
    filter:
      - "tray*.png"
mac:
  category: public.app-category.entertainment
  icon: resources/icons/icon.icns
  target:
    - dmg
win:
  icon: resources/icons/icon.ico
  target:
    - nsis
    - portable
    # - zip
linux:
  icon: resources/icons/icon-256.png
  target:
    - AppImage
    - deb
  category: Amusement
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
